{{define "content"}}
<main>
  <h1>Sign in</h1>
  <p>Enter your email and we'll send you a link that signs you in. No password.</p>
  {{if .Error}}<div class="banner">{{.Error}}</div>{{end}}
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{.Next}}">
    <label for="email">Email address</label>
    <input id="email" type="email" name="email" value="{{.Email}}" placeholder="you@example.com" autocomplete="email" autofocus required>
    <button type="submit">Email me a link</button>
  </form>
</main>
{{end}}
