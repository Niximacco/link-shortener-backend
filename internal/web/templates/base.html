{{define "base"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{{.Title}} &middot; {{.SiteName}}</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%97%3C/text%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f7;
    --card: #ffffff;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --line: #e3e3e6;
    --accent: #1d1d1f;
    --accent-text: #ffffff;
    --error-bg: #fdeceb;
    --error-text: #a1281d;
    --ok-bg: #eaf6ed;
    --ok-text: #1c6b34;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131316;
      --card: #1c1c20;
      --text: #f2f2f4;
      --muted: #9a9aa2;
      --line: #2e2e34;
      --accent: #f2f2f4;
      --accent-text: #131316;
      --error-bg: #3a1f1c;
      --error-text: #ffb4aa;
      --ok-bg: #1b2f22;
      --ok-text: #96d9ad;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  main {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 32px;
  }
  main.wide { max-width: 900px; }
  h1 { margin: 0 0 6px; font-size: 21px; letter-spacing: -0.01em; }
  p { margin: 0 0 20px; color: var(--muted); font-size: 15px; }
  p.tight { margin-bottom: 8px; }
  label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 600; }
  input[type=email], input[type=text], input[type=url] {
    width: 100%;
    padding: 11px 12px;
    margin-bottom: 16px;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    width: 100%;
    padding: 11px 16px;
    border: 0;
    border-radius: 9px;
    background: var(--accent);
    color: var(--accent-text);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { opacity: 0.88; }
  button.link {
    width: auto;
    padding: 0;
    background: none;
    color: var(--muted);
    font-size: 13px;
    font-weight: 500;
    text-decoration: underline;
  }
  a { color: var(--text); }
  .banner {
    padding: 10px 12px;
    margin-bottom: 18px;
    border-radius: 9px;
    font-size: 14px;
    background: var(--error-bg);
    color: var(--error-text);
  }
  .banner.ok { background: var(--ok-bg); color: var(--ok-text); }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding-top: 18px;
    margin-top: 22px;
    border-top: 1px solid var(--line);
  }
  .row form { margin: 0; }
  .who { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
  .result {
    display: none;
    padding: 12px;
    margin-top: 18px;
    border-radius: 9px;
    background: var(--ok-bg);
    color: var(--ok-text);
    font-size: 14px;
    overflow-wrap: anywhere;
  }
  .result a { color: inherit; font-weight: 600; }
  .muted-small { font-size: 13px; color: var(--muted); }
  label.check {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    margin: 0 0 16px;
    font-size: 13px;
    font-weight: 400;
    color: var(--muted);
    cursor: pointer;
  }
  label.check input { width: auto; margin: 2px 0 0; }
  .tag {
    display: inline-block;
    margin-left: 6px;
    padding: 1px 6px;
    border-radius: 20px;
    background: var(--bg);
    border: 1px solid var(--line);
    font-size: 11px;
    color: var(--muted);
    vertical-align: middle;
  }
  .tag.off { background: var(--error-bg); color: var(--error-text); border-color: transparent; }
  /* A tag pill. The colour is set inline from the tag's own colour, so only the
     shape lives here. */
  .pill {
    display: inline-block;
    margin: 2px 4px 2px 0;
    padding: 2px 9px;
    border-radius: 20px;
    border: 1px solid transparent;
    font-size: 12px;
    font-weight: 600;
    line-height: 18px;
    text-decoration: none;
    white-space: nowrap;
    vertical-align: middle;
  }
  .pill:hover { opacity: 0.85; }
  .filters {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 2px;
    margin-top: 12px;
  }
  /* An unselected filter is an outline so the selected one reads as the one
     that is doing something. */
  .pill.filter {
    background: var(--card);
    color: var(--muted);
    font-weight: 500;
    border-color: var(--line);
  }
  .pill.filter .dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    margin-right: 6px;
    border-radius: 50%;
    vertical-align: baseline;
  }
  .pill.filter.on { color: var(--accent-text); background: var(--accent); border-color: transparent; }
  .swatches { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .swatch {
    width: 26px;
    height: 26px;
    margin: 0;
    border-radius: 50%;
    border: 2px solid transparent;
    box-shadow: 0 0 0 1px var(--line);
    cursor: pointer;
  }
  .swatch input { position: absolute; opacity: 0; width: 0; height: 0; }
  /* The chosen swatch gets a ring in the page's own text colour, which reads on
     every colour in the palette and in both themes. */
  .swatch:has(input:checked) { border-color: var(--card); box-shadow: 0 0 0 2px var(--text); }
  td.tags { max-width: 220px; }
  td.tags .view { display: block; }
  td.swatch-cell .swatches { margin: 0; }
  td.who-cell { overflow-wrap: anywhere; }
  code { font-size: 12px; }
  .fields { display: flex; gap: 14px; }
  .fields > div { flex: 1; min-width: 0; }
  .list-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-top: 34px;
  }
  .list-head h2 { margin: 0; font-size: 15px; font-weight: 600; }
  .toggle { font-size: 13px; color: var(--muted); }
  .empty { margin: 14px 0 0; font-size: 14px; }
  .scroll { overflow-x: auto; margin-top: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th {
    padding: 8px 10px 8px 0;
    border-bottom: 1px solid var(--line);
    text-align: left;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    white-space: nowrap;
  }
  td {
    padding: 10px 10px 10px 0;
    border-bottom: 1px solid var(--line);
    vertical-align: middle;
  }
  th.num, td.num { text-align: right; padding-right: 14px; }
  td.code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; white-space: nowrap; }
  td.dest { max-width: 320px; }
  td.dest .view {
    display: block;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--muted);
  }
  td.when, td.who { white-space: nowrap; color: var(--muted); font-size: 13px; }
  td.actions { white-space: nowrap; text-align: right; }
  td.actions button { margin-left: 10px; }
  td .edit {
    width: 100%;
    margin: 0;
    padding: 6px 8px;
    font-size: 13px;
  }
  td.code .edit { width: 120px; }
  /* Rows carry both a view and an editor; the row's state picks one. */
  tr .edit, tr [data-action="save"], tr [data-action="cancel"] { display: none; }
  tr.editing .view, tr.editing [data-action="edit"], tr.editing [data-action="delete"] { display: none; }
  tr.editing .edit { display: inline-block; }
  /* The colour picker is an editor too, but it stays a flex row of swatches. */
  tr.editing .edit.swatches { display: flex; }
  tr.editing [data-action="save"], tr.editing [data-action="cancel"] { display: inline; }
  tr.editing [data-action="save"] { color: var(--text); font-weight: 600; }
  @media (max-width: 620px) {
    .fields { flex-direction: column; gap: 0; }
    td.dest { max-width: 180px; }
  }
</style>
</head>
<body>
<script>
  // Shared by every page that talks to the api. A 401 means the session went
  // away while the page was open, so hand the visitor back to the login form
  // instead of showing them a failure they can't act on.
  async function send(url, options) {
    const response = await fetch(url, options);
    if (response.status === 401) {
      window.location = "/login";
      throw new Error("signed out");
    }
    return response;
  }
</script>
{{template "content" .}}
</body>
</html>{{end}}
